<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GradeMaster CGPA Calculator</title>
    
    <!-- React & ReactDOM -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    
    <!-- Babel (to interpret JSX in browser) -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                    }
                }
            }
        }
    </script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; }
    </style>
</head>
<body class="bg-slate-50 transition-colors duration-300">
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect } = React;

        // --- Icons (Inline SVGs) ---
        const Icons = {
            Plus: (props) => <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" {...props}><path d="M5 12h14"/><path d="M12 5v14"/></svg>,
            Trash2: (props) => <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" {...props}><path d="M3 6h18"/><path d="M19 6v14c0 1-1 2-2 2H7c-1 0-2-1-2-2V6"/><path d="M8 6V4c0-1 1-2 2-2h4c1 0 2 1 2 2v2"/><line x1="10" x2="10" y1="11" y2="17"/><line x1="14" x2="14" y1="11" y2="17"/></svg>,
            Settings: (props) => <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" {...props}><path d="M12.22 2h-.44a2 2 0 0 0-2 2v.18a2 2 0 0 1-1 1.73l-.43.25a2 2 0 0 1-2 0l-.15-.08a2 2 0 0 0-2.73.73l-.22.38a2 2 0 0 0 .73 2.73l.15.1a2 2 0 0 1 1 1.72v.51a2 2 0 0 1-1 1.74l-.15.09a2 2 0 0 0-.73 2.73l.22.38a2 2 0 0 0 2.73.73l.15-.08a2 2 0 0 1 2 0l.43.25a2 2 0 0 1 1 1.73V20a2 2 0 0 0 2 2h.44a2 2 0 0 0 2-2v-.18a2 2 0 0 1 1-1.73l.43-.25a2 2 0 0 1 2 0l.15.08a2 2 0 0 0 2.73-.73l.22-.39a2 2 0 0 0-.73-2.73l-.15-.09a2 2 0 0 1-1-1.74v-.47a2 2 0 0 1 1-1.74l.15-.09a2 2 0 0 0 .73-2.73l-.22-.39a2 2 0 0 0-2.73-.73l-.15.08a2 2 0 0 1-2 0l-.43-.25a2 2 0 0 1-1-1.73V4a2 2 0 0 0-2-2z"/><circle cx="12" cy="12" r="3"/></svg>,
            Calculator: (props) => <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" {...props}><rect width="16" height="20" x="4" y="2" rx="2"/><line x1="8" x2="16" y1="6" y2="6"/><line x1="16" x2="16" y1="14" y2="18"/><path d="M16 10h.01"/><path d="M12 10h.01"/><path d="M8 10h.01"/><path d="M12 14h.01"/><path d="M8 14h.01"/><path d="M12 18h.01"/><path d="M8 18h.01"/></svg>,
            GraduationCap: (props) => <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" {...props}><path d="M21.42 10.922a1 1 0 0 0-.019-1.838L12.83 5.18a2 2 0 0 0-1.66 0L2.6 9.08a1 1 0 0 0 0 1.832l8.57 3.908a2 2 0 0 0 1.66 0z"/><path d="M22 10v6"/><path d="M6 12.5V16a6 3 0 0 0 12 0v-3.5"/></svg>,
            ChevronDown: (props) => <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" {...props}><path d="m6 9 6 6 6-6"/></svg>,
            ChevronUp: (props) => <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" {...props}><path d="m18 15-6-6-6 6"/></svg>,
            Moon: (props) => <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" {...props}><path d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9Z"/></svg>,
            Sun: (props) => <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" {...props}><circle cx="12" cy="12" r="4"/><path d="M12 2v2"/><path d="M12 20v2"/><path d="m4.93 4.93 1.41 1.41"/><path d="m17.66 17.66 1.41 1.41"/><path d="M2 12h2"/><path d="M20 12h2"/><path d="m6.34 17.66-1.41 1.41"/><path d="m19.07 4.93-1.41 1.41"/></svg>
        };

        const Card = ({ children, className = "" }) => (
            <div className={`bg-white dark:bg-slate-800 rounded-xl shadow-lg border border-slate-200 dark:border-slate-700 overflow-hidden ${className}`}>
                {children}
            </div>
        );

        const InputGroup = ({ label, value, max, onChange, className = "" }) => (
            <div className={`flex flex-col ${className}`}>
                <label className="text-xs font-semibold text-slate-500 dark:text-slate-400 mb-1 uppercase tracking-wider">
                    {label} <span className="text-slate-300 dark:text-slate-600">/ {max}</span>
                </label>
                <input
                    type="number"
                    min="0"
                    max={max}
                    value={value}
                    onChange={(e) => onChange(parseFloat(e.target.value) || 0)}
                    className="w-full px-3 py-2 bg-slate-50 dark:bg-slate-900 border border-slate-200 dark:border-slate-700 rounded-lg focus:ring-2 focus:ring-indigo-500 focus:outline-none transition-all font-mono text-slate-800 dark:text-slate-100"
                    placeholder="0"
                />
            </div>
        );

        const App = () => {
            const [darkMode, setDarkMode] = useState(false);
            const [showSettings, setShowSettings] = useState(false);
            
            // Configuration State
            const [weights, setWeights] = useState({
                attendance: 10,
                ct: 20,
                assignment: 10,
                mid: 20,
                final: 40,
            });

            const [gradingScale, setGradingScale] = useState([
                { grade: 'A+', point: 4.00, min: 80 },
                { grade: 'A',  point: 3.75, min: 75 },
                { grade: 'A-', point: 3.50, min: 70 },
                { grade: 'B+', point: 3.25, min: 65 },
                { grade: 'B',  point: 3.00, min: 60 },
                { grade: 'B-', point: 2.75, min: 55 },
                { grade: 'C+', point: 2.50, min: 50 },
                { grade: 'C',  point: 2.25, min: 45 },
                { grade: 'D',  point: 2.00, min: 40 },
                { grade: 'F',  point: 0.00, min: 0 },
            ]);

            // Data State
            const [courses, setCourses] = useState([
                { id: 1, name: 'Computer Architecture', credits: 3, marks: { attendance: 10, ct: 18, assignment: 9, mid: 18, final: 34 }, expanded: true },
                { id: 2, name: 'Data Structures', credits: 3, marks: { attendance: 8, ct: 15, assignment: 8, mid: 16, final: 30 }, expanded: false },
            ]);

            const [previousCGPA, setPreviousCGPA] = useState({ credits: 0, cgpa: 0 });

            // Effects
            useEffect(() => {
                if (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches) {
                    setDarkMode(true);
                }
            }, []);

            useEffect(() => {
                const body = document.body;
                if (darkMode) {
                    body.classList.add('dark', 'bg-slate-900', 'text-slate-100');
                    body.classList.remove('bg-slate-50', 'text-slate-800');
                } else {
                    body.classList.remove('dark', 'bg-slate-900', 'text-slate-100');
                    body.classList.add('bg-slate-50', 'text-slate-800');
                }
            }, [darkMode]);

            // Calculations
            const calculateTotalMarks = (marks) => {
                return (marks.attendance || 0) + (marks.ct || 0) + (marks.assignment || 0) + (marks.mid || 0) + (marks.final || 0);
            };

            const getGrade = (totalMarks) => {
                const totalWeight = Object.values(weights).reduce((a, b) => a + b, 0);
                const percentage = (totalMarks / totalWeight) * 100;
                return gradingScale.find(g => percentage >= g.min) || gradingScale[gradingScale.length - 1];
            };

            const currentGPA = (() => {
                let totalPoints = 0;
                let totalCredits = 0;

                courses.forEach(course => {
                    const totalMarks = calculateTotalMarks(course.marks);
                    const grade = getGrade(totalMarks);
                    totalPoints += grade.point * course.credits;
                    totalCredits += course.credits;
                });

                return totalCredits === 0 ? 0 : (totalPoints / totalCredits).toFixed(2);
            })();

            const totalCredits = courses.reduce((sum, course) => sum + course.credits, 0);

            const finalCGPA = (() => {
                const currentPoints = parseFloat(currentGPA) * totalCredits;
                const prevPoints = previousCGPA.cgpa * previousCGPA.credits;
                const allCredits = totalCredits + previousCGPA.credits;

                return allCredits === 0 ? 0 : ((currentPoints + prevPoints) / allCredits).toFixed(2);
            })();

            // Handlers
            const addCourse = () => {
                const newId = Math.max(...courses.map(c => c.id), 0) + 1;
                setCourses([...courses, { 
                    id: newId, 
                    name: `Course ${newId}`, 
                    credits: 3, 
                    marks: { attendance: 0, ct: 0, assignment: 0, mid: 0, final: 0 },
                    expanded: true
                }]);
            };

            const updateCourse = (id, field, value) => {
                setCourses(courses.map(c => c.id === id ? { ...c, [field]: value } : c));
            };

            const updateMarks = (id, field, value) => {
                setCourses(courses.map(c => {
                    if (c.id === id) {
                        const max = weights[field];
                        const safeValue = Math.min(Math.max(value, 0), max);
                        return { ...c, marks: { ...c.marks, [field]: safeValue } };
                    }
                    return c;
                }));
            };

            const toggleExpand = (id) => {
                setCourses(courses.map(c => c.id === id ? { ...c, expanded: !c.expanded } : c));
            };

            const removeCourse = (id) => {
                setCourses(courses.filter(c => c.id !== id));
            };

            return (
                <div className="min-h-screen pb-20 font-sans">
                    {/* Header */}
                    <header className="sticky top-0 z-30 bg-white/80 dark:bg-slate-900/80 backdrop-blur-md border-b border-slate-200 dark:border-slate-800">
                        <div className="max-w-4xl mx-auto px-4 py-4 flex justify-between items-center">
                            <div className="flex items-center space-x-3">
                                <div className="bg-indigo-600 p-2 rounded-lg">
                                    <Icons.GraduationCap className="w-6 h-6 text-white" />
                                </div>
                                <h1 className="text-xl font-bold bg-clip-text text-transparent bg-gradient-to-r from-indigo-600 to-violet-600 dark:from-indigo-400 dark:to-violet-400">
                                    GradeMaster
                                </h1>
                            </div>
                            <div className="flex items-center space-x-2">
                                <button 
                                    onClick={() => setDarkMode(!darkMode)}
                                    className="p-2 rounded-full hover:bg-slate-100 dark:hover:bg-slate-800 transition-colors"
                                >
                                    {darkMode ? <Icons.Sun className="w-5 h-5" /> : <Icons.Moon className="w-5 h-5" />}
                                </button>
                                <button 
                                    onClick={() => setShowSettings(!showSettings)}
                                    className={`p-2 rounded-full transition-colors ${showSettings ? 'bg-indigo-100 text-indigo-600 dark:bg-indigo-900/50 dark:text-indigo-400' : 'hover:bg-slate-100 dark:hover:bg-slate-800'}`}
                                >
                                    <Icons.Settings className="w-5 h-5" />
                                </button>
                            </div>
                        </div>
                    </header>

                    <main className="max-w-4xl mx-auto px-4 py-8 space-y-6">
                        {/* Settings Panel */}
                        {showSettings && (
                            <div className="animate-in slide-in-from-top-4 duration-300">
                                <Card className="p-6 bg-gradient-to-br from-indigo-50 to-white dark:from-slate-800 dark:to-slate-800/50 border-indigo-100 dark:border-slate-700">
                                    <div className="flex justify-between items-center mb-4">
                                        <h3 className="font-bold text-lg flex items-center space-x-2">
                                            <Icons.Settings className="w-4 h-4 text-indigo-500" />
                                            <span>Configuration</span>
                                        </h3>
                                        <button 
                                            onClick={() => setShowSettings(false)}
                                            className="text-sm text-indigo-600 hover:text-indigo-700 font-medium"
                                        >
                                            Done
                                        </button>
                                    </div>
                                    
                                    <div className="grid grid-cols-1 md:grid-cols-2 gap-6">
                                        <div>
                                            <h4 className="text-sm font-semibold text-slate-500 uppercase tracking-wider mb-3">Max Marks Distribution</h4>
                                            <div className="space-y-3">
                                                {Object.entries(weights).map(([key, val]) => (
                                                    <div key={key} className="flex items-center justify-between">
                                                        <label className="capitalize text-sm">{key.replace(/([A-Z])/g, ' $1').trim()}</label>
                                                        <input 
                                                            type="number" 
                                                            value={val}
                                                            onChange={(e) => setWeights({...weights, [key]: parseFloat(e.target.value) || 0})}
                                                            className="w-20 px-2 py-1 text-right rounded border border-slate-300 dark:border-slate-600 bg-white dark:bg-slate-900 text-sm"
                                                        />
                                                    </div>
                                                ))}
                                                <div className="flex justify-between pt-2 border-t border-slate-200 dark:border-slate-700 font-bold text-sm">
                                                    <span>Total</span>
                                                    <span className={Object.values(weights).reduce((a,b)=>a+b,0) !== 100 ? "text-amber-500" : "text-green-500"}>
                                                        {Object.values(weights).reduce((a,b)=>a+b,0)}
                                                    </span>
                                                </div>
                                            </div>
                                        </div>

                                        <div>
                                            <h4 className="text-sm font-semibold text-slate-500 uppercase tracking-wider mb-3">Grading Scale (Top 4)</h4>
                                            <div className="space-y-2 text-sm text-slate-600 dark:text-slate-400">
                                                <p>Currently using standard 4.0 scale.</p>
                                                <div className="grid grid-cols-2 gap-2">
                                                    {gradingScale.slice(0, 4).map((g) => (
                                                        <div key={g.grade} className="flex justify-between bg-white dark:bg-slate-900 p-2 rounded border border-slate-200 dark:border-slate-700">
                                                            <span className="font-bold">{g.grade}</span>
                                                            <span>&ge; {g.min}%</span>
                                                        </div>
                                                    ))}
                                                </div>
                                                <p className="text-xs italic mt-2 opacity-75">* Logic applies to all grades down to F</p>
                                            </div>
                                        </div>
                                    </div>
                                </Card>
                            </div>
                        )}

                        {/* Overview Stats */}
                        <div className="grid grid-cols-1 md:grid-cols-3 gap-4">
                            <Card className="p-6 bg-gradient-to-br from-indigo-600 to-violet-700 text-white border-none">
                                <h3 className="text-indigo-200 text-sm font-medium mb-1">Current Semester GPA</h3>
                                <div className="flex items-baseline space-x-2">
                                    <span className="text-4xl font-bold">{currentGPA}</span>
                                    <span className="text-indigo-200 text-sm">/ 4.00</span>
                                </div>
                                <div className="mt-4 text-sm text-indigo-100 opacity-90">
                                    Based on {totalCredits} credits
                                </div>
                            </Card>

                            <Card className="p-6">
                                <h3 className="text-slate-500 dark:text-slate-400 text-sm font-medium mb-1">Cumulative CGPA</h3>
                                <div className="flex items-baseline space-x-2">
                                    <span className={`text-4xl font-bold ${finalCGPA >= 3.0 ? 'text-green-500' : finalCGPA >= 2.5 ? 'text-amber-500' : 'text-red-500'}`}>
                                        {finalCGPA}
                                    </span>
                                    <span className="text-slate-400 text-sm">/ 4.00</span>
                                </div>
                                <div className="mt-4 flex space-x-4">
                                    <div className="flex-1">
                                        <label className="text-[10px] uppercase font-bold text-slate-400">Prev Credits</label>
                                        <input 
                                            type="number" 
                                            value={previousCGPA.credits}
                                            onChange={(e) => setPreviousCGPA({...previousCGPA, credits: parseFloat(e.target.value) || 0})}
                                            className="w-full bg-slate-100 dark:bg-slate-900 border-none rounded px-2 py-1 text-sm" 
                                            placeholder="0"
                                        />
                                    </div>
                                    <div className="flex-1">
                                        <label className="text-[10px] uppercase font-bold text-slate-400">Prev CGPA</label>
                                        <input 
                                            type="number" 
                                            value={previousCGPA.cgpa}
                                            onChange={(e) => setPreviousCGPA({...previousCGPA, cgpa: parseFloat(e.target.value) || 0})}
                                            className="w-full bg-slate-100 dark:bg-slate-900 border-none rounded px-2 py-1 text-sm" 
                                            placeholder="0.00"
                                        />
                                    </div>
                                </div>
                            </Card>

                            <Card className="p-6 flex flex-col justify-center items-center text-center space-y-2 border-dashed border-2 bg-transparent shadow-none hover:bg-slate-50 dark:hover:bg-slate-800/50 transition-colors cursor-pointer group" onClick={addCourse}>
                                <div className="w-12 h-12 rounded-full bg-indigo-50 dark:bg-indigo-900/30 flex items-center justify-center text-indigo-600 dark:text-indigo-400 group-hover:scale-110 transition-transform">
                                    <Icons.Plus className="w-6 h-6" />
                                </div>
                                <span className="font-semibold text-indigo-600 dark:text-indigo-400">Add New Course</span>
                            </Card>
                        </div>

                        {/* Course List */}
                        <div className="space-y-4">
                            <div className="flex items-center justify-between px-2">
                                <h2 className="text-lg font-bold flex items-center gap-2">
                                    <Icons.Calculator className="w-5 h-5 text-indigo-500" />
                                    Course Breakdown
                                </h2>
                                <span className="text-sm text-slate-500">{courses.length} courses</span>
                            </div>

                            {courses.map((course) => {
                                const total = calculateTotalMarks(course.marks);
                                const grade = getGrade(total);
                                
                                return (
                                    <Card key={course.id} className="transition-all duration-300 hover:shadow-xl hover:border-indigo-200 dark:hover:border-indigo-900">
                                        {/* Course Header */}
                                        <div className="p-4 flex items-center justify-between cursor-pointer" onClick={() => toggleExpand(course.id)}>
                                            <div className="flex-1">
                                                <div className="flex items-center gap-3">
                                                    <input 
                                                        type="text" 
                                                        value={course.name}
                                                        onClick={(e) => e.stopPropagation()}
                                                        onChange={(e) => updateCourse(course.id, 'name', e.target.value)}
                                                        className="font-bold text-lg bg-transparent border-b border-transparent hover:border-slate-300 focus:border-indigo-500 focus:outline-none max-w-[200px] md:max-w-md"
                                                    />
                                                    <span className={`px-2 py-0.5 rounded text-xs font-bold ${
                                                        grade.point >= 3.5 ? 'bg-green-100 text-green-700 dark:bg-green-900/30 dark:text-green-400' :
                                                        grade.point >= 2.5 ? 'bg-amber-100 text-amber-700 dark:bg-amber-900/30 dark:text-amber-400' :
                                                        'bg-red-100 text-red-700 dark:bg-red-900/30 dark:text-red-400'
                                                    }`}>
                                                        {grade.grade} ({grade.point})
                                                    </span>
                                                </div>
                                                <div className="flex items-center gap-4 mt-1 text-sm text-slate-500">
                                                    <div className="flex items-center gap-1">
                                                        <span>Credits:</span>
                                                        <input 
                                                            type="number" 
                                                            value={course.credits}
                                                            onClick={(e) => e.stopPropagation()}
                                                            onChange={(e) => updateCourse(course.id, 'credits', parseFloat(e.target.value) || 0)}
                                                            className="w-10 bg-slate-100 dark:bg-slate-800 rounded px-1 text-center"
                                                        />
                                                    </div>
                                                    <div className="w-px h-3 bg-slate-300"></div>
                                                    <span>Total: {total.toFixed(1)}/{Object.values(weights).reduce((a,b)=>a+b,0)}</span>
                                                </div>
                                            </div>
                                            
                                            <div className="flex items-center gap-3">
                                                {course.expanded ? <Icons.ChevronUp className="w-5 h-5 text-slate-400" /> : <Icons.ChevronDown className="w-5 h-5 text-slate-400" />}
                                            </div>
                                        </div>

                                        {/* Expanded Details */}
                                        {course.expanded && (
                                            <div className="px-4 pb-6 pt-2 border-t border-slate-100 dark:border-slate-700/50 bg-slate-50/50 dark:bg-slate-800/30">
                                                <div className="grid grid-cols-2 md:grid-cols-3 lg:grid-cols-5 gap-4">
                                                    <InputGroup 
                                                        label="Attendance" 
                                                        value={course.marks.attendance} 
                                                        max={weights.attendance}
                                                        onChange={(v) => updateMarks(course.id, 'attendance', v)} 
                                                    />
                                                    <InputGroup 
                                                        label="Class Test" 
                                                        value={course.marks.ct} 
                                                        max={weights.ct}
                                                        onChange={(v) => updateMarks(course.id, 'ct', v)} 
                                                    />
                                                    <InputGroup 
                                                        label="Assignment" 
                                                        value={course.marks.assignment} 
                                                        max={weights.assignment}
                                                        onChange={(v) => updateMarks(course.id, 'assignment', v)} 
                                                    />
                                                    <InputGroup 
                                                        label="Midterm" 
                                                        value={course.marks.mid} 
                                                        max={weights.mid}
                                                        onChange={(v) => updateMarks(course.id, 'mid', v)} 
                                                    />
                                                    <InputGroup 
                                                        label="Final Exam" 
                                                        value={course.marks.final} 
                                                        max={weights.final}
                                                        onChange={(v) => updateMarks(course.id, 'final', v)} 
                                                    />
                                                </div>
                                                <div className="mt-4 flex justify-end">
                                                    <button 
                                                        onClick={() => removeCourse(course.id)}
                                                        className="text-xs flex items-center gap-1 text-red-500 hover:text-red-600 px-3 py-1.5 rounded-full hover:bg-red-50 dark:hover:bg-red-900/20 transition-colors"
                                                    >
                                                        <Icons.Trash2 className="w-3 h-3" /> Remove Course
                                                    </button>
                                                </div>
                                            </div>
                                        )}
                                        
                                        {/* Progress Bar Visual */}
                                        <div className="h-1.5 w-full bg-slate-100 dark:bg-slate-900">
                                            <div 
                                                className={`h-full transition-all duration-500 ${
                                                    grade.point >= 3.5 ? 'bg-gradient-to-r from-green-400 to-green-600' :
                                                    grade.point >= 2.5 ? 'bg-gradient-to-r from-amber-400 to-amber-600' :
                                                    'bg-gradient-to-r from-red-400 to-red-600'
                                                }`}
                                                style={{ width: `${Math.min((total / Object.values(weights).reduce((a,b)=>a+b,0)) * 100, 100)}%` }}
                                            ></div>
                                        </div>
                                    </Card>
                                );
                            })}

                            {courses.length === 0 && (
                                <div className="text-center py-12 text-slate-400">
                                    <p>No courses added yet. Click the + button to start.</p>
                                </div>
                            )}
                        </div>
                    </main>
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
